name: Build Screenbox for Windows 10 (x64)

# 上游源码在 Windows runner 上用 MSBuild / UWP 工具链编译，输出已签名 x64 MSIX，直接作为 Release 资产发布。

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CERT_PASSWORD: ScreenboxBuild2026
      UPSTREAM: https://github.com/huynhsontung/Screenbox.git
    steps:
      - name: 1. Verify workflow write permission
        shell: pwsh
        run: |
          Set-Content -Path permcheck.txt -Value "permission check"
          gh release create permcheck --repo $env:GITHUB_REPOSITORY --title "permission check" --notes "temporary" permcheck.txt
          if ($LASTEXITCODE -ne 0) { throw "GITHUB_TOKEN cannot create releases (write permission missing)" }
          gh release delete permcheck --repo $env:GITHUB_REPOSITORY --yes
          Write-Host "GITHUB_TOKEN write permission OK"

      - name: 2. Clone upstream source
        shell: pwsh
        run: |
          git clone --depth 1 $env:UPSTREAM src
          Push-Location src
          $sha = git rev-parse HEAD
          Pop-Location
          "UPSTREAM_SHA=$sha" >> $env:GITHUB_ENV

      - name: 3. Setup .NET 11 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.x'

      - name: 4. Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: 5. Update package manifest and version
        shell: pwsh
        working-directory: src
        run: |
          ./scripts/Update-AppxManifest.ps1 -Identity Sideload
          ./scripts/Update-ProjectVersion.ps1

      - name: 6. Create and install self-signed certificate
        shell: pwsh
        run: |
          $secure = ConvertTo-SecureString -String $env:CERT_PASSWORD -Force -AsPlainText
          $pfxPath = Join-Path $env:GITHUB_WORKSPACE "src\Screenbox\Screenbox_TemporaryKey.pfx"
          $cerPath = Join-Path $env:GITHUB_WORKSPACE "src\Screenbox\Screenbox_TemporaryKey.cer"
          $cert = New-SelfSignedCertificate -Type Custom `
            -Subject "CN=ABCDF790-DBE4-48F7-8204-32FCB69ADF9C" `
            -KeyUsage DigitalSignature -KeySpec Signature `
            -FriendlyName "Screenbox Self-Signed" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") `
            -KeyExportPolicy Exportable
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $secure | Out-Null
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
          Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $secure | Out-Null
          "CERT_THUMB=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          Write-Host "Certificate thumbprint: $($cert.Thumbprint)"

      - name: 7. Build signed x64 MSIX
        shell: pwsh
        working-directory: src
        run: |
          $msbuildArgs = @(
            'Screenbox\Screenbox.csproj', '-restore', '-v:normal',
            '-p:RestoreConfigFile=nuget.config', '-p:ContinuousIntegrationBuild=true',
            '-p:Configuration=Release', '-p:Platform=x64',
            '-p:UapAppxPackageBuildMode=SideloadOnly', '-p:AppxBundlePlatforms=x64',
            '-p:AppxPackageSigningEnabled=True',
            "-p:PackageCertificateThumbprint=$env:CERT_THUMB"
          )
          & msbuild @msbuildArgs 2>&1 | Tee-Object -FilePath msbuild.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 7b. Archive build log (always)
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path diag -Force | Out-Null
          if (Test-Path "src\msbuild.log") { Copy-Item "src\msbuild.log" "diag\msbuild.log" }
          $lines = @()
          $lines += Get-ChildItem "src\Screenbox\AppPackages" -Recurse -File -ErrorAction SilentlyContinue | ForEach-Object { "$($_.FullName) | $($_.Length)" }
          $lines | Set-Content "diag\apppackages-tree.txt"
          gh release create "build-log-$env:GITHUB_RUN_NUMBER" --repo $env:GITHUB_REPOSITORY --title "Build log $env:GITHUB_RUN_NUMBER" --notes "MSBuild log and AppPackages tree" "diag\msbuild.log" "diag\apppackages-tree.txt"

      - name: 9. Publish release
        if: success()
        shell: pwsh
        run: |
          "step9 start" | Set-Content "step9.log"
          function Note([string]$m) {
            [IO.File]::AppendAllText("step9.log", "$m`r`n")
            Write-Host $m
          }
          try {
            $ws = $env:GITHUB_WORKSPACE
            $bundle = Get-ChildItem "$ws\src\Screenbox\AppPackages" -Recurse -File -Filter *.msixbundle | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $bundle) { throw "msixbundle not found" }
            $pkg = $bundle.FullName

            $cer = "$ws\src\Screenbox\Screenbox_TemporaryKey.cer"
            if (-not (Test-Path -LiteralPath $cer)) { throw "cer not found: $cer" }

            $ins = "$ws\INSTALL.txt"
            if (-not (Test-Path -LiteralPath $ins)) {
              $ins = "$ws\INSTALL-generated.txt"
              @(
                "Screenbox Windows 10 x64 安装说明",
                "---------------------------------",
                "1. 设置 -> 更新和安全 -> 开发者选项，开启 开发人员模式/旁加载应用。",
                "2. 右键 Screenbox_TemporaryKey.cer -> 安装证书 -> 本地计算机 -> 受信任的根证书颁发机构。",
                "3. 双击 .msixbundle 安装，或执行 Add-AppxPackage -Path .\*.msixbundle",
                "",
                "上游仓库：https://github.com/huynhsontung/Screenbox （GPL-3.0）"
              ) | Set-Content -LiteralPath $ins -Encoding utf8
            }

            $ver = $env:APP_VERSION
            if ([string]::IsNullOrEmpty($ver) -and ($bundle.Name -match '(\d+\.\d+\.\d+\.\d+)')) { $ver = $Matches[1] }
            if ([string]::IsNullOrEmpty($ver)) { $ver = "0.0.0.0" }
            Note "pkg=$pkg bytes=$($bundle.Length)"
            Note "cer exists=$(Test-Path -LiteralPath $cer)"
            Note "ins=$ins exists=$(Test-Path -LiteralPath $ins) ver=$ver"

            $tag = "v$ver-x64"
            $r = & gh release create $tag --repo $env:GITHUB_REPOSITORY --title "Screenbox $ver Windows 10 x64" --notes "Built from huynhsontung/Screenbox on GitHub Actions." $pkg $cer $ins 2>&1 | Out-String
            Note "A create exit=$LASTEXITCODE out=$r"
            if ($LASTEXITCODE -ne 0) {
              $tag = "v$ver-x64-r$env:GITHUB_RUN_NUMBER"
              $r = & gh release create $tag --repo $env:GITHUB_REPOSITORY --title "Screenbox $ver Windows 10 x64" --notes "Built from huynhsontung/Screenbox on GitHub Actions." $pkg $cer $ins 2>&1 | Out-String
              Note "B create-retry exit=$LASTEXITCODE out=$r"
            }
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Note "done tag=$tag"
          } catch {
            Note "EXCEPTION($($_.InvocationInfo.ScriptLineNumber)): $($_.Exception.Message)"
            exit 1
          }

      - name: 9b. Archive release step log (always)
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "step9.log") {
            gh release create "rel-log-$env:GITHUB_RUN_NUMBER" --repo $env:GITHUB_REPOSITORY --title "Release step log $env:GITHUB_RUN_NUMBER" --notes "gh release output for the publish step" "step9.log"
          }

      - name: 10. Upload MSIX bundle as workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Screenbox-win10-x64-msix
          path: |
            src/Screenbox/AppPackages/**/*.msixbundle
            src/Screenbox/Screenbox_TemporaryKey.cer
          if-no-files-found: warn
