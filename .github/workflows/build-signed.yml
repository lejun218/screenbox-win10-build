name: Build Screenbox for Windows 10 (x64)

# 从上游开源仓库拉取源码，在 Windows runner 上用 Visual Studio / MSBuild 的
# UWP 工具链编译，生成带有自签名证书的 x64 MSIX 安装包，并发布到 Release 便于下载。

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CERT_PASSWORD: ScreenboxBuild2026
      UPSTREAM: https://github.com/huynhsontung/Screenbox.git
    steps:
      - name: 1. Verify workflow write permission
        shell: pwsh
        run: |
          Set-Content -Path permcheck.txt -Value "permission check"
          gh release create permcheck --repo $env:GITHUB_REPOSITORY --title "permission check" --notes "temporary" permcheck.txt
          if ($LASTEXITCODE -ne 0) { throw "GITHUB_TOKEN cannot create releases (write permission missing)" }
          gh release delete permcheck --repo $env:GITHUB_REPOSITORY --yes
          Write-Host "GITHUB_TOKEN write permission OK"

      - name: 2. Clone upstream source
        shell: pwsh
        run: |
          git clone --depth 1 $env:UPSTREAM src
          Push-Location src
          $sha = git rev-parse HEAD
          $cdate = git log -1 --format=%cI
          Pop-Location
          "UPSTREAM_SHA=$sha" >> $env:GITHUB_ENV
          "UPSTREAM_DATE=$cdate" >> $env:GITHUB_ENV
          Write-Host "Upstream commit: $sha ($cdate)"

      - name: 3. Setup .NET 11 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.x'

      - name: 4. Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: 5. Update package manifest and version
        shell: pwsh
        working-directory: src
        run: |
          ./scripts/Update-AppxManifest.ps1 -Identity Sideload
          ./scripts/Update-ProjectVersion.ps1

      - name: 6. Create and install self-signed certificate
        shell: pwsh
        run: |
          $secure = ConvertTo-SecureString -String $env:CERT_PASSWORD -Force -AsPlainText
          $pfxPath = Join-Path $env:GITHUB_WORKSPACE "src\Screenbox\Screenbox_TemporaryKey.pfx"
          $cerPath = Join-Path $env:GITHUB_WORKSPACE "src\Screenbox\Screenbox_TemporaryKey.cer"
          $cert = New-SelfSignedCertificate -Type Custom `
            -Subject "CN=ABCDF790-DBE4-48F7-8204-32FCB69ADF9C" `
            -KeyUsage DigitalSignature `
            -KeySpec Signature `
            -FriendlyName "Screenbox Self-Signed" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") `
            -KeyExportPolicy Exportable
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $secure | Out-Null
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
          $imported = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation "Cert:\CurrentUser\My" -Password $secure
          "CERT_THUMB=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          Write-Host "Certificate thumbprint: $($cert.Thumbprint)" ($imported.Thumbprint)

      - name: 7. Build signed x64 MSIX
        shell: pwsh
        working-directory: src
        run: |
          $msbuildArgs = @(
            'Screenbox\Screenbox.csproj',
            '-restore',
            '-v:normal',
            '-p:RestoreConfigFile=nuget.config',
            '-p:ContinuousIntegrationBuild=true',
            '-p:Configuration=Release',
            '-p:Platform=x64',
            '-p:UapAppxPackageBuildMode=SideloadOnly',
            '-p:AppxBundlePlatforms=x64',
            '-p:AppxPackageSigningEnabled=True',
            "-p:PackageCertificateThumbprint=$env:CERT_THUMB"
          )
          & msbuild @msbuildArgs 2>&1 | Tee-Object -FilePath msbuild.log
          "MSBUILD_EXIT_CODE=$LASTEXITCODE" >> $env:GITHUB_ENV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 7b. Archive build log (always)
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path diag -Force | Out-Null
          if (Test-Path "src\msbuild.log") { Copy-Item "src\msbuild.log" "diag\msbuild.log" }
          $lines = @("MSBUILD_EXIT_CODE=$env:MSBUILD_EXIT_CODE")
          if (Test-Path "src\Screenbox\AppPackages") {
            $lines += Get-ChildItem "src\Screenbox\AppPackages" -Recurse -File | ForEach-Object { "$($_.FullName) | $($_.Length)" }
          } else {
            $lines += "AppPackages folder does not exist"
          }
          $lines | Set-Content "diag\apppackages-tree.txt"
          $tag = "build-log-$env:GITHUB_RUN_NUMBER"
          gh release create $tag --repo $env:GITHUB_REPOSITORY --title "Build log $env:GITHUB_RUN_NUMBER" --notes "MSBuild log and AppPackages tree" "diag\msbuild.log" "diag\apppackages-tree.txt"
          if (Test-Path "src\msbuild.log") {
            $hits = Select-String -Path "src\msbuild.log" -Pattern "error |APPX[0-9]{4}|MSB[0-9]{4}" -CaseSensitive:$false | Select-Object -First 10
            foreach ($h in $hits) { Write-Host "::error::$($h.Line.Trim())" }
          }

      - name: 8. Collect artifacts and zip install kit
        if: success()
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "src\Screenbox"
          $bundles = @(Get-ChildItem $root -Recurse -File -Filter *.msixbundle -ErrorAction SilentlyContinue)
          $packages = @(Get-ChildItem $root -Recurse -File -Filter *.msix -ErrorAction SilentlyContinue)
          Write-Host "bundles=$($bundles.Count) msix=$($packages.Count)"
          $bundles | ForEach-Object { Write-Host "BUNDLE $($_.FullName) $($_.Length)" }
          $packages | ForEach-Object { Write-Host "MSIX $($_.FullName) $($_.Length)" }

          $pick = $null
          $x64bundle = $bundles | Where-Object { $_.Name -match '_x64' } | Sort-Object Length -Descending | Select-Object -First 1
          if ($x64bundle) { $pick = $x64bundle }
          if (-not $pick -and $bundles.Count -gt 0) { $pick = $bundles | Sort-Object Length -Descending | Select-Object -First 1 }
          if (-not $pick) {
            $x64pkg = $packages | Where-Object { $_.Name -match '_x64\.msix$' -and $_.Name -notmatch 'language' } | Sort-Object Length -Descending | Select-Object -First 1
            if ($x64pkg) { $pick = $x64pkg }
          }
          if (-not $pick) { throw "No installable MSIX package produced by the build" }
          Write-Host "Picked: $($pick.FullName) ($($pick.Length) bytes)"

          if ($pick.Name -match '(\d+\.\d+\.\d+\.\d+)') {
            "APP_VERSION=$($Matches[1])" >> $env:GITHUB_ENV
          } else {
            "APP_VERSION=0.0.0.0" >> $env:GITHUB_ENV
          }

          $out = Join-Path $env:GITHUB_WORKSPACE "kit"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item -Path $pick.FullName -Destination $out
          $depDir = Join-Path $pick.Directory.FullName "Dependencies"
          if (Test-Path $depDir) { Copy-Item -Path $depDir -Destination $out -Recurse }
          Copy-Item -Path (Join-Path $root "Screenbox_TemporaryKey.cer") -Destination $out
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "INSTALL.txt") -Destination $out

          Compress-Archive -Path "$out\*" -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "Screenbox-win10-x64.zip") -CompressionLevel Optimal -Force
          Get-Item (Join-Path $env:GITHUB_WORKSPACE "Screenbox-win10-x64.zip") | Select-Object Name, Length | Format-Table

      - name: 9. Publish release with install kit
        if: success()
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE "Screenbox-win10-x64.zip"
          $tag = "v$env:APP_VERSION-x64"
          gh release create $tag --repo $env:GITHUB_REPOSITORY --title "Screenbox $env:APP_VERSION (Windows 10 x64)" --notes-file (Join-Path $env:GITHUB_WORKSPACE "NOTES.md") $zip
          if ($LASTEXITCODE -ne 0) {
            $tag = "v$env:APP_VERSION-x64-$env:GITHUB_RUN_NUMBER"
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "Screenbox $env:APP_VERSION (Windows 10 x64) build $env:GITHUB_RUN_NUMBER" --notes-file (Join-Path $env:GITHUB_WORKSPACE "NOTES.md") $zip
          }
          Write-Host "Released $tag"

      - name: 10. Upload workflow artifact as fallback
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Screenbox-win10-x64
          path: Screenbox-win10-x64.zip
          if-no-files-found: warn
